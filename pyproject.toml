[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lily"
version = "0.1.0"
description = "Lily — a local-first personal AI computer assistant for Windows."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Lily" }]

dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "psutil>=5.9",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "faster-whisper>=1.0.0",
    "mss>=9.0",
    "Pillow>=10.0",
    "pystray>=0.19",
    "pynput>=1.7",
    "openai>=1.40",
    "pyttsx3>=2.90; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4;   sys_platform == 'win32'",
    "pywin32>=306;    sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
lily = "lily.main:main"

# GUI entry point: launched via pythonw.exe (no console window). Used by autostart.
[project.gui-scripts]
lilyw = "lily.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lily"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
